# buildkitd 配置: 多平台构建的 Docker Hub 访问策略
#
# 国内 mirror (daocloud/1ms) 拉 manifest 可用, 但大 blob 下载频繁 EOF 中断,
# 且 mirror 优先于代理生效 (buildkitd.toml 的 mirrors 会劫持 docker.io 全部流量),
# 导致 buildx 容器的 HTTP_PROXY 形同虚设。
# 因此不再配置 mirror: 由 build_docker.py 创建 builder 时注入的
# env.HTTP_PROXY=host.docker.internal:7890 (宿主 Clash) 直连 Docker Hub,
# 该路径经 crane push/pull 长期验证稳定。
# [registry."docker.io"]
#   mirrors = [ "https://docker.m.daocloud.io","https://docker.1ms.run"]
#   insecure = false
