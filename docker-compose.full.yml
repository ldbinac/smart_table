# SmartTable 完整生产环境部署配置
# 包含 PostgreSQL 数据库、Redis 缓存、MinIO 对象存储
# 适用于生产环境的高可用部署

services:
  # PostgreSQL 数据库服务
  postgres:
    image: postgres:16-alpine
    container_name: smarttable-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-smarttable}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smarttable123}
      POSTGRES_DB: ${DB_NAME:-smarttable}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - smarttable-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-smarttable} -d ${DB_NAME:-smarttable}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: smarttable-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - smarttable-network
    healthcheck:
      # redis 配置了 requirepass，健康检查必须带密码，否则 NOAUTH 导致永远失败
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis123} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # MinIO 对象存储服务（可选）
  # 注意：后端 MinIO 上传功能尚未实现（attachment_service.py 中为 TODO），
  # 当前附件存储在本地 uploads 目录（见下方 uploads_data 卷），此服务仅供未来扩展
  minio:
    image: minio/minio:latest
    container_name: smarttable-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - smarttable-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  # SmartTable 统一应用（包含前后端）
  # 注意：统一镜像内仍会启动一个仅监听 127.0.0.1 的内嵌 Redis（Supervisor 托管），
  # 它不对外暴露、不与外部 redis 容器冲突；业务缓存/SocketIO 队列走下方 REDIS_URL
  # 指向的外部 redis 容器，内嵌实例仅为镜像单容器部署能力保留，可忽略。
  smarttable:
    build:
      context: .
      dockerfile: Dockerfile
    # 与 docker-compose.yml 保持同一镜像名，避免两种部署方式各构建一份镜像
    image: ${SMARTTABLE_IMAGE:-smarttable:latest}
    container_name: smarttable
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      # Flask 配置
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-jwt-secret-in-production}
      JWT_ACCESS_TOKEN_EXPIRES: ${JWT_ACCESS_TOKEN_EXPIRES:-86400}
      
      # 数据库配置（使用 PostgreSQL）
      DATABASE_URL: postgresql+psycopg://${DB_USER:-smarttable}:${DB_PASSWORD:-smarttable123}@postgres:5432/${DB_NAME:-smarttable}
      
      # Redis 配置
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      # SocketIO 消息队列（完整部署中 Redis 在独立容器且带密码，必须显式指定）
      SOCKETIO_MESSAGE_QUEUE: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/2
      
      # MinIO 配置
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET_NAME: smarttable
      MINIO_SECURE: "false"
      
      # 上传配置
      UPLOAD_FOLDER: /app/uploads
      MAX_CONTENT_LENGTH: 52428800  # 50MB
      
      # 日志配置
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # 实时协作配置
      ENABLE_REALTIME: ${ENABLE_REALTIME:-false}
    volumes:
      # 持久化上传文件
      - uploads_data:/app/uploads
      # 日志文件
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # MinIO 未加入 depends_on：后端 MinIO 功能尚未实现，不应对启动形成硬依赖
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - smarttable-network
    deploy:
      resources:
        limits:
          memory: 2G

# 数据卷定义
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  uploads_data:
    driver: local

# 网络定义
networks:
  smarttable-network:
    driver: bridge
